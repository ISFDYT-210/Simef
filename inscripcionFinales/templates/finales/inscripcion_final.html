{% extends 'base/base.html' %}
{% block title %}Inscripción final{% endblock %}
{% block encabezado %}Inscripción final{% endblock %}
{% block content %}
<div class="mx-auto max-w-lg">
  <form method="post" id="inscForm" class="rounded-2xl border border-slate-200 bg-white p-6">
    {% csrf_token %}
    <div class="space-y-3">{{ form.as_p }}</div>
    <button type="submit" class="mt-4 rounded-lg bg-tinta-900 px-5 py-2 text-sm font-semibold text-white hover:bg-tinta-800">Inscribirse</button>
  </form>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var c = 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-celeste-500 focus:outline-none focus:ring-2 focus:ring-celeste-100'.split(' ');
    document.querySelectorAll('#inscForm input:not([type=hidden]):not([type=checkbox]), #inscForm select, #inscForm textarea')
      .forEach(function (el) { el.classList.add.apply(el.classList, c); });
  });
</script>
{% endblock %}
