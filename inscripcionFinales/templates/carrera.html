{% extends 'base/base.html' %}
{% comment %} UBICACIÓN: inscripcionFinales/templates/carrera.html {% endcomment %}

{% block title %}Registro de Carrera{% endblock %}
{% block encabezado %}Registro de carrera{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl">
  <div id="formCard" class="rounded-2xl border border-slate-200 bg-white p-6">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="mt-2 rounded-lg bg-emerald-600 px-5 py-2 text-sm font-semibold text-white hover:bg-emerald-500">Guardar</button>
    </form>
  </div>
</div>

<script>
  window.addEventListener('DOMContentLoaded', () => {
    const base = 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-celeste-500 focus:outline-none focus:ring-2 focus:ring-celeste-100';
    document.querySelectorAll('#formCard input, #formCard select, #formCard textarea').forEach(el => {
      if (['checkbox','radio','submit','button','hidden'].includes(el.type)) return;
      if (el.type === 'file') { el.className = 'block w-full text-sm text-slate-600 file:mr-3 file:rounded-lg file:border-0 file:bg-tinta-900 file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-tinta-800'; return; }
      el.className = base;
    });
    document.querySelectorAll('#formCard label').forEach(l => l.className = 'mb-1 block text-sm font-medium text-slate-700');
    document.querySelectorAll('#formCard form > p').forEach(p => p.className = 'mb-4');
  });
</script>
{% endblock %}
