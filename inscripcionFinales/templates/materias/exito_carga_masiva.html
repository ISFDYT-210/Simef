{% extends 'base/base.html' %}
{% block title %}Carga masiva completada{% endblock %}
{% block content %}
<div class="grid min-h-[60vh] place-items-center px-4">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center">
    <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-emerald-50 text-emerald-500">
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.5 11 14.5 15.5 10M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/></svg>
    </div>
    <h2 class="mt-4 text-lg font-bold text-tinta-900">Carga masiva completada</h2>
    <div class="mt-4 grid grid-cols-2 gap-3">
      <div class="rounded-xl bg-slate-50 p-4">
        <div class="text-2xl font-bold text-emerald-600">{{ materias_creadas }}</div>
        <div class="text-xs text-slate-500">Materias creadas</div>
      </div>
      <div class="rounded-xl bg-slate-50 p-4">
        <div class="text-2xl font-bold text-amber-600">{{ materias_duplicadas|default:0 }}</div>
        <div class="text-xs text-slate-500">Ya existían</div>
      </div>
    </div>
    <div class="mt-6 flex justify-center gap-3">
      <a href="/lista_materias_admin/" class="inline-block rounded-lg bg-tinta-900 px-6 py-2.5 text-sm font-semibold text-white hover:bg-tinta-800">Ver materias</a>
      <a href="{% url 'AltaMasivaMaterias' %}" class="inline-block rounded-lg border border-slate-300 px-6 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50">Cargar más</a>
    </div>
  </div>
</div>
{% endblock %}
