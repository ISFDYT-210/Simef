{% extends 'base/base.html' %}
{% block title %}Eliminar materia{% endblock %}
{% block content %}
<div class="grid min-h-[50vh] place-items-center px-4">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 text-center">
    <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-red-50 text-red-500">
      <svg class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7"/></svg>
    </div>
    <h2 class="mt-4 text-lg font-bold text-tinta-900">Eliminar materia</h2>
    <p class="mt-2 text-sm text-slate-600">¿Estás seguro de que querés eliminar la materia "<strong>{{ materia.materia.nombre_materia }}</strong>"?</p>
    <form method="post" class="mt-6 flex items-center justify-center gap-2">
      {% csrf_token %}
      <button type="submit" class="rounded-lg bg-red-600 px-5 py-2 text-sm font-semibold text-white hover:bg-red-700">Sí, eliminar</button>
      <a href="/listaMateriasEst" class="rounded-lg border border-slate-300 px-5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
