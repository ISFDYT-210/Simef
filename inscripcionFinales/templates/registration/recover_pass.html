{% extends 'base/base.html' %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<h2 class="text-lg font-bold text-tinta-900">Recuperar contraseña</h2>
<p class="mt-1 text-sm text-slate-500">Ingresá tu correo y te enviaremos un enlace para restablecerla.</p>
<form action="../recuperar_pass/" method="post" id="recForm" class="mt-5 space-y-4">
  {% csrf_token %}
  {{ form.email }}
  <button type="submit" class="w-full rounded-lg bg-tinta-900 px-4 py-2.5 text-sm font-semibold text-white hover:bg-tinta-800">Enviar</button>
  <p class="text-center text-sm"><a href="/accounts/login/" class="font-medium text-celeste-600 hover:text-celeste-500 hover:underline">Volver al inicio de sesión</a></p>
</form>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var c = 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-celeste-500 focus:outline-none focus:ring-2 focus:ring-celeste-100'.split(' ');
    document.querySelectorAll('#recForm input:not([type=hidden]):not([type=checkbox]), #recForm select, #recForm textarea')
      .forEach(function (el) { el.classList.add.apply(el.classList, c); });
  });
</script>
{% endblock %}
