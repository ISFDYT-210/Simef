{% extends 'base/base.html' %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}

<div class="mb-6 flex flex-col items-center text-center">
  <img src="/static/imagenes/SIMEF.png" class="mb-3 h-16 object-contain" alt="SIMEF">
  <h1 class="text-lg font-semibold text-tinta-900">Recuperar contraseña</h1>
</div>

<p class="mb-4 text-center text-sm text-slate-500">
  Ingresá tu DNI: si tenés un email cargado, te vamos a mandar un link para elegir una contraseña nueva.
</p>

<form method="post" class="space-y-4">
  {% csrf_token %}

  <div>
    <label for="id_dni" class="mb-1 block text-sm font-medium text-slate-700">DNI</label>
    <input type="text" name="dni" id="id_dni" inputmode="numeric" autocomplete="username"
           placeholder="Sin puntos ni espacios" autofocus required
           class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-celeste-500 focus:outline-none focus:ring-2 focus:ring-celeste-100">
  </div>

  <button type="submit" class="w-full rounded-lg bg-tinta-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-tinta-800">Enviar</button>

  <p class="text-center text-sm">
    <a href="/accounts/login/" class="font-medium text-celeste-600 hover:underline">Volver al Inicio de Sesión</a>
  </p>
</form>

{% endblock %}
