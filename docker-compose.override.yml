# Ajustes SOLO para desarrollo local. Docker Compose lee este archivo
# automaticamente y lo superpone a docker-compose.yml.

services:
  db:
    ports:
      - "5432:5432"

  web:
    volumes:
      # El codigo fuente montado: editar y recargar sin reconstruir la imagen.
      - .:/app

    environment:
      # Fijo en True a proposito, sin leer del .env: este archivo es SOLO para
      # desarrollo local (ver encabezado), y el .env trae DEBUG=False porque
      # esta pensado para produccion. `${DEBUG:-True}` no servia como
      # fallback: docker compose toma el DEBUG=False del .env igual, asi que
      # el contenedor arrancaba con DEBUG apagado -> settings.py prende
      # SECURE_SSL_REDIRECT -> Django redirige cada pedido a https, que el
      # servidor de desarrollo no entiende (="Bad request version" a repeticion
      # en el log, el navegador reintentando por HTTPS contra un puerto HTTP).
      DEBUG: "True"

      # IMPORTANTE: esto pisa el DATABASE_URL del .env a proposito.
      #
      # entrypoint.sh corre `migrate` en cada arranque del contenedor. Si el
      # DATABASE_URL del .env apunta a Neon, cada `docker compose up` aplica a
      # la base del instituto las migraciones de la rama en la que estes parado.
      # Ya paso: el 2026-10-06 se aplicaron a Neon dos migraciones que solo
      # existian en una rama de integracion sin mergear.
      #
      # Apuntando al servicio `db` de este compose, el desarrollo local queda
      # aislado y Neon solo se toca desde un despliegue deliberado.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    # runserver en vez de gunicorn --reload: gunicorn avisa "Reloader is on.
    # Use in development only!" porque bajo Docker, con todo el codigo
    # montado como volumen, el watcher consume memoria hasta que el worker
    # se queda sin memoria y gunicorn lo mata con SIGKILL -> Internal Server
    # Error intermitente, sin relacion con ninguna pagina en particular.
    # runserver esta hecho para este caso y no tiene ese problema.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
